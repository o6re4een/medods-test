---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/bmi":
    get:
      summary: calculate bmi
      parameters:
      - name: id
        required: true
        description: Patient ID
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
                Category: Obesity
                bmi: 41.917
                height: 1.96
                weight: 161.03
  "/bmr":
    post:
      summary: calculate bmr
      tags:
      - BMR
      parameters: []
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
                patient_id: 1
                formula: harris
                result: '3283.85895'
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  formula:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                formula:
                  type: string
                  example: mifflin
                  description: Formula name lowercase
                id:
                  type: integer
                  example: 1
                  description: Patient Id
        required: true
    get:
      summary: history bmr
      tags:
      - BMR
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: integer
      - name: offset
        in: query
        schema:
          type: integer
      - name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
              - id: 1
                patient_id: 1
                formula_id: 1
                result: '55.0'
                calculated_on: '2025-02-21'
                created_at: '2025-09-27T19:55:19.004Z'
                updated_at: '2025-09-27T19:55:19.004Z'
  "/doctors":
    get:
      summary: list doctors
      tags:
      - Doctor
      parameters:
      - name: offset
        in: query
        required: false
        schema:
          type: number
      - name: limit
        in: query
        required: false
        schema:
          type: number
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
              - id: 1
                first_name: Sunday
                last_name: Blanda
                middle_name: Marvin
                created_at: '2025-09-27T19:55:19.092Z'
                updated_at: '2025-09-27T19:55:19.092Z'
              - id: 2
                first_name: Beula
                last_name: Luettgen
                middle_name: Rogahn
                created_at: '2025-09-27T19:55:19.096Z'
                updated_at: '2025-09-27T19:55:19.096Z'
              - id: 3
                first_name: Lesley
                last_name: Bogan
                middle_name: O'Connell
                created_at: '2025-09-27T19:55:19.098Z'
                updated_at: '2025-09-27T19:55:19.098Z'
              - id: 4
                first_name: Hai
                last_name: Jenkins
                middle_name: Johns
                created_at: '2025-09-27T19:55:19.102Z'
                updated_at: '2025-09-27T19:55:19.102Z'
              - id: 5
                first_name: Tawana
                last_name: Kutch
                middle_name: Rath
                created_at: '2025-09-27T19:55:19.104Z'
                updated_at: '2025-09-27T19:55:19.104Z'
    post:
      summary: create doctor
      tags:
      - Doctor
      parameters: []
      responses:
        '201':
          description: Doctor created successfully
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                middle_name:
                  type: string
              required:
              - first_name
              - last_name
  "/doctors/{id}":
    parameters:
    - name: id
      in: path
      description: id
      required: true
      schema:
        type: integer
    get:
      summary: show doctor
      tags:
      - Doctor
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
                id: 6
                first_name: Agustin
                last_name: Hammes
                middle_name: Crooks
                created_at: '2025-09-27T19:55:19.278Z'
                updated_at: '2025-09-27T19:55:19.278Z'
    put:
      summary: update doctor
      tags:
      - Doctor
      parameters: []
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
                first_name: Caleb
                last_name: Lebsack
                middle_name: Moore
                id: 6
                created_at: '2025-09-27T19:55:19.361Z'
                updated_at: '2025-09-27T19:55:19.361Z'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                middle_name:
                  type: string
  "/gender":
    get:
      summary: list genders
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
              - id: 1
                name: Male
                created_at: '2025-09-27T19:55:19.517Z'
                updated_at: '2025-09-27T19:55:19.517Z'
    post:
      summary: create gender
      parameters: []
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
                error: 'Error {name: ["Gender name already exists"]}'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                gender:
                  type: string
              description: 'gender ex: Male'
  "/patients":
    get:
      summary: list patients
      parameters:
      - name: full_name
        in: query
        schema:
          type: string
      - name: gender
        in: query
        schema:
          type: string
      - name: offset
        in: query
        schema:
          type: integer
      - name: limit
        in: query
        schema:
          type: integer
      tags:
      - Patients
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
              - id: 1
                first_name: Sang
                last_name: Grant
                middle_name: Mueller
                gender_id: 1
                birthday: '1964-04-10'
                height: 65
                weight: '250.85'
                created_at: '2025-09-27T19:55:19.751Z'
                updated_at: '2025-09-27T19:55:19.751Z'
                full_name: sang grant mueller
                doctors:
                - id: 1
                  first_name: Noel
                  last_name: Armstrong
                  middle_name: Carroll
                  created_at: '2025-09-27T19:55:19.753Z'
                  updated_at: '2025-09-27T19:55:19.753Z'
                - id: 2
                  first_name: Ava
                  last_name: Gutkowski
                  middle_name: Altenwerth
                  created_at: '2025-09-27T19:55:19.756Z'
                  updated_at: '2025-09-27T19:55:19.756Z'
                gender:
                  id: 1
                  name: Male
                  created_at: '2025-09-27T19:55:19.747Z'
                  updated_at: '2025-09-27T19:55:19.747Z'
    post:
      summary: Create patient
      tags:
      - Patients
      parameters: []
      responses:
        '201':
          description: created
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                patient:
                  type: object
                  properties:
                    first_name:
                      type: string
                    last_name:
                      type: string
                    birthday:
                      type: string
                      format: date
                    height:
                      type: number
                    weight:
                      type: number
                    gender:
                      type: string
                    doctor_ids:
                      type: array
                      items:
                        type: integer
                  required:
                  - first_name
                  - last_name
                  - birthday
                  - height
                  - weight
                  - gender
  "/patients/{id}":
    parameters:
    - name: id
      in: path
      description: id
      required: true
      schema:
        type: integer
    get:
      summary: show patient
      tags:
      - Patients
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
                id: 1
                first_name: Domenic
                last_name: Maggio
                middle_name: Weimann
                gender_id: 1
                birthday: '1971-11-13'
                height: 185
                weight: '132.94'
                created_at: '2025-09-27T19:55:19.948Z'
                updated_at: '2025-09-27T19:55:19.948Z'
                full_name: domenic maggio weimann
                doctors: []
                gender:
                  id: 1
                  name: Female
                  created_at: '2025-09-27T19:55:19.944Z'
                  updated_at: '2025-09-27T19:55:19.944Z'
    put:
      summary: update patient
      tags:
      - Patients
      parameters: []
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
                id: 1
                first_name: Иван
                last_name: Петров
                middle_name: Konopelski
                gender_id: 1
                birthday: '1990-01-01'
                height: 180
                weight: '75.0'
                created_at: '2025-09-27T19:55:20.024Z'
                updated_at: '2025-09-27T19:55:20.033Z'
                full_name: иван петров konopelski
                doctors: []
servers:
- url: http://{defaultHost}
  variables:
    defaultHost:
      default: localhost:3000
