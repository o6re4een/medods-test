version: "3.9"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - path: .env
        required: true
    environment:

      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PORT: ${DB_PORT}
    ports:
      - "${DB_PORT}:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

#  db_test:
#    image: postgres:15
#    volumes:
#      - pgdata_test:/var/lib/postgresql/data
#    env_file:
#      - path: .env
#        required: true
#    environment:
#      POSTGRES_USER: ${DB_USER}
#      POSTGRES_PASSWORD: ${DB_PASSWORD}
#      POSTGRES_DB: ${DB_NAME_TEST}
#      POSTGRES_PORT: ${DB_PORT_TEST}
#    ports:
#      - "${DB_PORT_TEST}:5432"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: bash -c "bundle exec rails s -b 0.0.0.0 -p 3000"
    volumes:
      - .:/rails
    ports:
      - "3000:3000"
    depends_on:
      - db
    env_file:
      - path: .env
        required: true
    environment:
      DB_HOST: db
      DB_PORT: 5432

volumes:
  pgdata:
  pgdata_test: